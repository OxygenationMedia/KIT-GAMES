<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIT Creator Dashboard</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><div class="badge">PRIVATE CREATOR AREA</div><h1>🏆 Live Leaderboard</h1><div id="login" class="card"><label>Admin PIN</label><input id="pin" type="password"><button class="primary" onclick="login()">Open Dashboard</button></div><div id="dash" style="display:none"><div id="stats" class="stats"></div><div class="card"><button class="secondary" onclick="load()">🔄 Refresh</button><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Player</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th><th>R5</th><th>Total</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main><script>let token="";async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:document.getElementById("pin").value})}),d=await r.json();if(!r.ok)return alert(d.error);token=d.token;login.style.display="none";dash.style.display="block";load()}async function load(){let h={Authorization:"Bearer "+token};let [a,b]=await Promise.all([fetch("/api/admin/leaderboard",{headers:h}),fetch("/api/admin/stats",{headers:h})]);let x=await a.json(),y=await b.json();stats.innerHTML=`<div class="stat"><b>${y.participants}</b>Participants</div><div class="stat"><b>${y.highest}</b>Highest</div><div class="stat"><b>${y.average}</b>Average</div>`;rows.innerHTML=x.players.map(p=>`<tr><td>${p.rank<=3?["🥇","🥈","🥉"][p.rank-1]:p.rank}</td><td>${p.name}</td><td>${p.round1}</td><td>${p.round2}</td><td>${p.round3}</td><td>${p.round4}</td><td>${p.round5}</td><td><b>${p.total}</b></td><td><button onclick="del(${p.id})">Delete</button></td></tr>`).join("")}async function del(id){if(confirm("Delete result?")){await fetch("/api/admin/players/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});load()}}</script></body></html>
